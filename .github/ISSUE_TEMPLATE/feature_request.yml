name: Feature request
description: 描述使用场景和希望解决的问题
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请描述什么时候会使用这项能力。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 描述中没有私人文档、账号、凭据或敏感截图。
          required: true
