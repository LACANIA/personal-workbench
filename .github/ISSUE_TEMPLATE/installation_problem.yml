name: Installation problem
description: 报告安装、SmartScreen、First Run、Ollama 或模型检测问题
title: "[Install] "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        当前 Beta 安装器尚未签名，SmartScreen 可能显示未知发布者。请勿在附件中包含私人文件、凭据或未经检查的诊断包。
  - type: input
    id: version
    attributes:
      label: Personal Workbench 版本
      placeholder: 0.3.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 安装阶段
      options:
        - 下载或 SHA 校验
        - 启动安装器
        - SmartScreen
        - 安装过程
        - 首次启动
        - First Run
        - 卸载或重新安装
    validations:
      required: true
  - type: textarea
    id: smartscreen
    attributes:
      label: SmartScreen 表现
      description: 如果无关，请填写“未出现”。
    validations:
      required: true
  - type: input
    id: ollama
    attributes:
      label: Ollama 状态和版本
      placeholder: 已运行 / 已安装但未运行 / 未安装，以及版本
  - type: input
    id: gpu
    attributes:
      label: CPU、RAM 和 GPU
  - type: textarea
    id: models
    attributes:
      label: 模型检测结果
      description: 只写模型名称和界面状态，不要粘贴私人配置。
  - type: textarea
    id: error
    attributes:
      label: 错误提示与复现步骤
    validations:
      required: true
  - type: dropdown
    id: diagnostic
    attributes:
      label: 是否有经过检查的诊断包
      options:
        - 有，可以按需提供
        - 没有
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经检查描述、截图和附件，其中没有私人文档、认证信息或完整私人目录。
          required: true
